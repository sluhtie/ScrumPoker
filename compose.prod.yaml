services:
  app:
    build:
      context: .
      # Build from the Git checkout in Dokploy; no separate Dockerfile needed.
      dockerfile_inline: |
        FROM node:24-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN --mount=type=cache,target=/root/.npm npm ci --no-audit --no-fund
        COPY . .
        RUN npm run build

        FROM node:24-alpine AS production
        WORKDIR /app
        ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
        COPY --from=build --chown=node:node /app/dist/standalone ./
        USER node
        EXPOSE 3000
        CMD ["node", "server.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    networks:
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your production PostgreSQL connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_CA: ${DATABASE_CA:-}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your public HTTPS origin}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
