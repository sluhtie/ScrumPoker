services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker_local_only
      POSTGRES_DB: planning_club
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d planning_club"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: node:24-alpine
    working_dir: /app
    init: true
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://poker:poker_local_only@db:5432/planning_club
      DATABASE_SSL: "false"
      APP_ORIGIN: http://localhost:${DEV_APP_PORT:-3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  node_modules:
  npm_cache:
