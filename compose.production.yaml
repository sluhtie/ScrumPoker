services:
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your production PostgreSQL connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_CA: ${DATABASE_CA:-}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your public HTTPS origin}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
